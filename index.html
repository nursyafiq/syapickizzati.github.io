<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Eternal Izzati & Syafiq</title>

<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  text-align: center;
  background-color: #fdf6f0;
}

.hero {
  padding: 100px 20px;
}

h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

.date {
  font-size: 20px;
}

#countdown {
  font-size: 28px;
  margin-top: 30px;
  font-weight: bold;
}

.section {
  padding: 80px 20px;
}

img {
  max-width: 100%;
  height: auto;
}
</style>
</head>

<body>

<div class="hero">
  <h1>The Eternal Izzati & Syafiq</h1>
  <div class="date">13 June 2026 | 8:00 AM</div>
  <div id="countdown"></div>
</div>

<div class="section">
  <h2>Our Story</h2>
  <p>Your love story text here...</p>
</div>

<div class="section">
  <h2>Event Details</h2>
  <p>Location details here...</p>
</div>

<script>
var countDownDate = new Date("Dec 20, 2026 10:00:00").getTime();

var x = setInterval(function() {
  var now = new Date().getTime();
  var distance = countDownDate - now;

  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("countdown").innerHTML =
  days + " Days " + hours + " Hours "
  + minutes + " Minutes " + seconds + " Seconds ";

  if (distance < 0) {
    clearInterval(x);
    document.getElementById("countdown").innerHTML = "We Are Married ❤️";
  }
}, 1000);
</script>

</body>
</html>

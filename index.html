<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Walimatul Urus - Nur Izzati & Muhammad Nursyafiq</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Playfair Display', serif;
}

.container{
  position:relative;
  max-width:700px;
  width:100%;
}

.frame{
  width:100%;
  display:block;
}

.text-layer{
  position:absolute;
  top:22%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  width:70%;
  color:#7b1e1e;
}

.text-layer h2{
  letter-spacing:4px;
  font-size:18px;
  margin-bottom:20px;
}

.names{
  font-family:'Great Vibes', cursive;
  font-size:48px;
  line-height:1.2;
  margin:20px 0;
}

.details{
  margin-top:20px;
  font-size:18px;
  letter-spacing:2px;
}

#countdown{
  margin-top:25px;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<div class="container">
  <img src="frame.png.png" class="frame">

  <div class="text-layer">
    <h2>WALIMATUL URUS</h2>

    <div class="names">
      Nur Izzati<br>
      &<br>
      Muhammad Nursyafiq
    </div>

    <div class="details">
      SABTU, 13 JUN 2026<br>
      PUSPANITAPURI DEWAN<br>
      SERI ENDON
    </div>

    <div id="countdown"></div>
  </div>
</div>

<script>
var countDownDate = new Date("June 13, 2026 08:00:00 GMT+08:00").getTime();

var x = setInterval(function(){
  var now = new Date().getTime();
  var distance = countDownDate - now;

  var days = Math.floor(distance / (1000*60*60*24));
  var hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
  var minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
  var seconds = Math.floor((distance % (1000*60)) / 1000);

  document.getElementById("countdown").innerHTML =
    days+" DAYS • "+hours+" HOURS • "+minutes+" MINUTES • "+seconds+" SECONDS";

  if(distance < 0){
    clearInterval(x);
    document.getElementById("countdown").innerHTML = "Majlis Bermula ❤️";
  }
},1000);
</script>

</body>
</html>
